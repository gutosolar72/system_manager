{% extends 'base.html' %}

{% block content %}
<h2>Vincular Licença #{{ licenca.id }}</h2>

<form method="POST">
    <div class="mb-3">
        <label for="contrato_id" class="form-label">Contrato</label>
        {{ contratos }}
        <select class="form-select" name="contrato_id" id="contrato_id" required>
            <option value="">Selecione</option>
            {% for contrato in contratos %}
            <option value="{{ contrato.id }}" {% if licenca.contrato_id == contrato.id %}selected{% endif %}>
                {{ contrato.cliente.nome_empresa }} - Contrato #{{ contrato.id }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Vincular</button>
    <a href="{{ url_for('main.licencas_lista') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
