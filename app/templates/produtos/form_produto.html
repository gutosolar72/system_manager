{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">{{ produto.id if produto else "Cadastrar Produto" }}</h1>
    <a href="{{ url_for('main.lista_produtos') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {{ form.hidden_tag() }}

            <div class="mb-3">
                <label for="nome_produto" class="form-label">Nome do Produto</label>
                <input type="text" class="form-control" id="nome_produto" name="nome_produto"
                       value="{{ produto.nome_produto if produto else '' }}" required>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ produto.descricao if produto else '' }}</textarea>
            </div>

            <div class="mb-3">
                <label for="preco_mensal_base" class="form-label">Preço Mensal Base (R$)</label>
                <input type="number" class="form-control" id="preco_mensal_base" name="preco_mensal_base"
                       value="{{ produto.preco_mensal_base if produto else '' }}" step="0.01" required>

            </div>

            <div class="mb-3">
                <label class="form-label">{{ form.modulos.label.text }}</label>
                <div class="d-flex flex-wrap">
                    {% for subfield in form.modulos %}
                        <div class="form-check me-3">
                            {{ subfield(class="form-check-input") }}
                            <label class="form-check-label">{{ subfield.label.text }}</label>
                        </div>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Salvar Produto</button>
        </form>
    </div>
</div>
{% endblock %}
